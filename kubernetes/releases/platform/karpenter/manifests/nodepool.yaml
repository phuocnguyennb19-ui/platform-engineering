# ============================================================
# Karpenter NodePool + EC2NodeClass — apply AFTER Karpenter is Ready:
#   kubectl apply -f karpenter/manifests/nodepool.yaml
#
# Cluster-specific — replace <clusterName>, AMI family, role, and the discovery
# tags (karpenter.sh/discovery) attached to the subnets/security groups.
# ============================================================
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    spec:
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]   # prefer spot, fall back to on-demand
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["m5.large", "m5.xlarge", "m6i.large", "m6i.xlarge"]
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: 720h        # rotate nodes after at most 30 days (immutable infra)
  limits:
    cpu: "100"
    memory: 200Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: "KarpenterNodeRole-<clusterName>"      # ← IAM role cho node
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<clusterName>"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "<clusterName>"
