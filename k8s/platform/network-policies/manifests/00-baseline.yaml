# ── application: dev · staging · prod ───────────────────────
# ⚠ The app chart ALREADY emits egress rules at staging/prod
#   (common/{staging,prod}.yaml.gotmpl → networkPolicy.egress), including
#   `allowExternalHTTPS: true`. Those UNION with the baseline here, so an app
#   that needs the internet keeps it — the baseline does not take it away.
#   At dev the chart emits no egress, so dev apps get in-cluster + DNS only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: dev
  labels: { managed-by: platform, policy: default-deny }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-baseline
  namespace: dev
  labels: { managed-by: platform }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 10.96.0.1/32 }
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - namespaceSelector: {}
---
