image:
  tag: "REPLACE_WITH_IMAGE_TAG"

ingress:
  enabled: true
  hosts:
    - host: __APP__.example.com
      paths:
        - { path: /, pathType: Prefix }
  tls:
    - secretName: __APP__-tls
      hosts: [ "__APP__.example.com" ]

