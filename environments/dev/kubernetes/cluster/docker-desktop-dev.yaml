# Cluster METADATA — what this cluster is and what it must offer. It provisions nothing.
# Docker Desktop's built-in Kubernetes used as the `dev` environment (namespace `dev`) on a
# laptop. Select it in target.local.yaml (`cluster: docker-desktop-dev`).
schema: kubernetes-environment/v1alpha1
name: docker-desktop-dev
provider: docker-desktop
environment: dev
context: docker-desktop

provisioning:
  method: docker-desktop      # Settings → Kubernetes → Enable; nothing in this repo creates it
  source: docs/clusters/providers/docker-desktop/README.md

delivery:
  owner: helmfile             # manual, from the repo root: helmfile -e dev -l name=<app> sync
  ciDeployAllowed: false

# Field meanings and preflight semantics: schemas/cluster.schema.json, README.md §4.
capabilities:
  ingress:
    expected: optional  # dev values use class kong; Docker Desktop ships no controller
    verified: unknown
  gatewayAPI:
    expected: not-used  # no app values render Gateway API objects
    verified: unknown
  prometheusOperator:
    expected: optional  # apps opt in with prometheusRule.enabled (off in shared app-values)
    verified: unknown
  persistentStorage:
    expected: optional  # the application chart has no persistence by default
    verified: unknown
