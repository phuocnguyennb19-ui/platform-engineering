# ============================================================
# Kyverno supply-chain policies — apply after Kyverno is Ready:
#   kubectl apply -f kyverno/manifests/policies-supplychain.yaml
#
# Scope: APP namespaces (dev/staging/prod) only — not applied to the infra
# namespace (upstream images from many registries: quay.io, registry.k8s.io,
# ghcr.io, public.ecr.aws... would be blocked by the allowlist).
# ============================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-trusted-registry
  annotations:
    policies.kyverno.io/title: Only pull app images from trusted registries
spec:
  background: true
  rules:
    - name: trusted-registry
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["dev", "staging", "prod"]
      validate:
        failureAction: Enforce
        message: "Every image must come from a trusted registry (ECR ap-southeast-1 / harbor / registry.gitlab.com/myorg)."
        # Anchored regex, not a glob pattern: Kyverno's `*` also matches `/`, so a glob like
        # `*.dkr.ecr…/*` admitted `evil.io/x.dkr.ecr…/y`. Every container kind is checked
        # (init and ephemeral containers used to be skipped).
        # ECR is where apps pull from (global.imageRegistry in environments/<env>/kubernetes/app-values).
        # The account is still REPLACE_WITH_* there, so any 12-digit account is accepted for now;
        # once known, replace [0-9]{12} with the env's account IDs (this manifest is not templated).
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                any:
                  - key: "{{ regex_match('^([0-9]{12}[.]dkr[.]ecr[.]ap-southeast-1[.]amazonaws[.]com|harbor[.][a-z0-9-]+[.]example[.]com|registry[.]gitlab[.]com/myorg)/', element.image) }}"
                    operator: Equals
                    value: false
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-image-digest
  annotations:
    policies.kyverno.io/title: Pin app images by digest
spec:
  background: true
  rules:
    - name: require-digest
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["prod"]
      validate:
        # Audit first (CI usually uses SHA tags); switch to Enforce once the
        # pipeline publishes digests.
        failureAction: Audit
        message: "Prod should pin images by digest (@sha256:...) instead of a tag."
        pattern:
          spec:
            containers:
              - image: "*@sha256:*"
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Verify cosign signatures on app images
spec:
  # If the verify service fails, do NOT block the cluster (we're in the Audit phase).
  webhookConfiguration:
    failurePolicy: Ignore
  background: false
  rules:
    - name: verify-signed
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["dev", "staging", "prod"]
      verifyImages:
        - imageReferences:
            - "harbor.*.example.com/*"
            - "registry.gitlab.com/myorg/*"
          failureAction: Audit          # Audit first → Enforce once images are signed
          mutateDigest: true            # pin the digest after verification
          verifyDigest: true
          required: true
          attestors:
            - entries:
                # Keyless (Sigstore/Fulcio) — CI signs with GitLab OIDC.
                - keyless:
                    subject: "https://gitlab.com/myorg/*"
                    issuer: "https://gitlab.com"
                    rekor:
                      url: https://rekor.sigstore.dev
                # Or use a fixed public key:
                # - keys:
                #     publicKeys: |-
                #       -----BEGIN PUBLIC KEY-----
                #       ...
                #       -----END PUBLIC KEY-----
