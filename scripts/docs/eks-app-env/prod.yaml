# Phần riêng của môi trường prod, gộp vào scripts/docs/eks-app-values.base.yaml bởi
# scripts/docs/gen-app-template.sh → applications/_template/k8s/prod/values.yaml.
image:
  tag: "REPLACE_WITH_IMAGE_TAG"
ingress:
  enabled: true
  hosts:
    - host: __APP__.example.com
      paths:
        - {path: /, pathType: Prefix}
  tls:
    - secretName: __APP__-tls
      hosts: ["__APP__.example.com"]
