# ============================================================
# PostgreSQL — client auth (mounted as ConfigMap → pg_hba.conf)
# Loaded via `primary.pgHbaConfiguration` (readFile) in values.yaml.gotmpl.
#
# scram-sha-256 everywhere (never trust/md5). Connections are already confined
# to the `database` namespace by NetworkPolicy; this is the second layer.
# ============================================================
# TYPE  DATABASE   USER          ADDRESS        METHOD
local   all        all                          scram-sha-256
# Streaming replication (readReplicas) inside the pod network.
host    replication all           10.0.0.0/8     scram-sha-256
host    replication all           172.16.0.0/12  scram-sha-256
host    replication all           192.168.0.0/16 scram-sha-256
# App traffic from in-cluster pod CIDRs only.
host    all        all            10.0.0.0/8     scram-sha-256
host    all        all            172.16.0.0/12  scram-sha-256
host    all        all            192.168.0.0/16 scram-sha-256
