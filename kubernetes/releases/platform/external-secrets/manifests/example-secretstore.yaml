# ============================================================
# External Secrets — an alternative to applying SOPS manually.
# Apply AFTER external-secrets is Ready:
#   kubectl apply -f external-secrets/manifests/example-secretstore.yaml
#
# ESO syncs secrets from AWS Secrets Manager → K8s Secret. Then you can drop the
# secret.*.yaml (SOPS) files — the source of truth is AWS SM, no ciphertext kept
# in git.
#
# Requires: an IRSA role for the external-secrets SA with
# secretsmanager:GetSecretValue, and these secrets in AWS SM:
#   platform/observability/grafana-admin      = {"admin-user":"admin","admin-password":"..."}
#   platform/observability/opensearch-admin   = {"username":"admin","password":"..."}
# ============================================================
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets            # ESO's SA (IRSA-annotated)
            namespace: infra                  # ESO lives in the infra ns
---
# Grafana admin → Secret "grafana-admin" in observability
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: grafana-admin                       # matches existingSecret in values
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: platform/observability/grafana-admin
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: platform/observability/grafana-admin
        property: admin-password
---
# OpenSearch admin → Secret "opensearch-admin" in observability
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-admin
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: opensearch-admin
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: platform/observability/opensearch-admin
        property: username
    - secretKey: password
      remoteRef:
        key: platform/observability/opensearch-admin
        property: password
