# ============================================================
# App-of-Apps ROOT — apply ONCE, then argocd manages the rest from git.
#   kubectl apply -f argocd/root-app.yaml
#
# It syncs the bootstrap/ dir (AppProject + ApplicationSet). The ApplicationSet
# then generates one Application per app-tier service under *.
#
# Repo: gitlab.com/myorg/helm-project-v3 @ main (already filled in).
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-bootstrap
  namespace: infra                      # namespace where argocd runs
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default                      # default project to avoid the chicken-and-egg
  source:
    repoURL: https://gitlab.com/myorg/helm-project-v3.git
    targetRevision: main
    path: argocd/bootstrap
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: infra
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ApplyOutOfSyncOnly=true
