ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: onprem-ca
  hosts:
    - host: __APP__.REPLACE_WITH_ONPREM_PROD_DOMAIN
      paths:
        - { path: /, pathType: Prefix }
  tls:
    - secretName: __APP__-tls
      hosts: [ "__APP__.REPLACE_WITH_ONPREM_PROD_DOMAIN" ]

