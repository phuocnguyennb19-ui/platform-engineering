# ============================================================
# PostgreSQL — custom tunables (mounted as ConfigMap → conf.d/override.conf)
# Source of truth for hardening/logging/replication settings.
# Loaded via `primary.extendedConfiguration` (readFile) in values.yaml.gotmpl,
# which the chart renders into a ConfigMap and appends after postgresql.conf.
#
# Env-sized values (max_connections / shared_buffers / effective_cache_size /
# ssl) are appended per-env from the $size table in values.yaml.gotmpl — keep
# them OUT of this file so one file serves all environments.
# ============================================================

# ── Write-Ahead Log / replication ───────────────────────────
wal_level = replica
max_wal_size = 2GB
min_wal_size = 80MB
wal_compression = on
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on

# ── Checkpoints ─────────────────────────────────────────────
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# ── Query planner / parallelism ─────────────────────────────
random_page_cost = 1.1            # SSD-oriented
effective_io_concurrency = 200
max_worker_processes = 8
max_parallel_workers_per_gather = 2
max_parallel_workers = 8

# ── Autovacuum (keep bloat in check) ────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ── Observability / audit ───────────────────────────────────
log_min_duration_statement = 500ms    # log slow queries
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%m [%p] %q%u@%d '
track_io_timing = on
track_functions = pl

# ── Safety ──────────────────────────────────────────────────
idle_in_transaction_session_timeout = 300000   # 5m — kill leaked idle txns
statement_timeout = 0                            # per-app override recommended
