{{- /* RBAC — off by default (least privilege). Enable only when the application
       genuinely talks to the Kubernetes API (leader election, config watching,
       operator patterns). Prefer `rbac.rules` (namespaced Role) over
       `rbac.clusterRules`; a ClusterRole is cluster-wide blast radius. */ -}}
{{- if and .Values.rbac.create .Values.serviceAccount.create }}
{{- if .Values.rbac.rules }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "application.fullname" . }}
  namespace: {{ include "application.namespace" . }}
  labels:
    {{- include "application.labels" (dict "root" $ "component" "app") | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "application.fullname" . }}
  namespace: {{ include "application.namespace" . }}
  labels:
    {{- include "application.labels" (dict "root" $ "component" "app") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "application.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "application.serviceAccountName" . }}
    namespace: {{ include "application.namespace" . }}
{{- end }}

{{- if .Values.rbac.clusterRules }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "application.fullname" . }}-{{ include "application.namespace" . }}
  labels:
    {{- include "application.labels" (dict "root" $ "component" "app") | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.clusterRules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "application.fullname" . }}-{{ include "application.namespace" . }}
  labels:
    {{- include "application.labels" (dict "root" $ "component" "app") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "application.fullname" . }}-{{ include "application.namespace" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "application.serviceAccountName" . }}
    namespace: {{ include "application.namespace" . }}
{{- end }}
{{- end }}
