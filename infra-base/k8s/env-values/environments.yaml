# ============================================================
# Shared environment VALUES — BASE file (included via `bases:`).
#
# Loaded by the root helmfile AND every per-domain helmfile, so all releases
# see the same dev/staging/prod values. Change env-wide defaults (namespace,
# storageClass, ingress) here in ONE place.
#
# ⚠ SECRETS are declared PER-HELMFILE, not here — because SOPS secret paths
# resolve relative to the evaluating helmfile's cwd. Each platform/<tool>/helmfile.yaml.gotmpl
# uses `../../../env-values/<env>/secrets.enc.yaml`.
#
# platformName / eksClusterName mirror terraform/stacks/core, which creates the
# cluster and the add-on IAM roles (<eksClusterName>-irsa-<addon>). Tool values
# build role ARNs, the velero bucket and the ECR mirror host from them plus
# AWS_ACCOUNT_ID, which CI sets from <ENV>_AWS_ACCOUNT_ID — never a literal ARN.
#
# Per-tool sizing (replicas/retention/resources) stays in each tool's
# values.yaml.gotmpl `$size` table — not here.
# ============================================================
environments:
  dev:
    values:
      - env: dev
        platformName: platform-dev          # terraform <name_prefix>-<environment>
        eksClusterName: platform-dev-eks    # terraform core output eks_cluster_name
        namespace: observability
        profile: dev
        clusterDomain: cluster.local
        storageClass: ""
        ingressClass: nginx-dev
        ingressDomain: dev.example.com
  staging:
    values:
      - env: staging
        platformName: platform-staging          # terraform <name_prefix>-<environment>
        eksClusterName: platform-staging-eks    # terraform core output eks_cluster_name
        namespace: observability
        profile: staging
        clusterDomain: cluster.local
        storageClass: ""
        ingressClass: nginx-staging
        ingressDomain: staging.example.com
  prod:
    values:
      - env: prod
        platformName: platform-production          # terraform <name_prefix>-<environment>
        eksClusterName: platform-production-eks    # terraform core output eks_cluster_name
        namespace: observability
        profile: prod
        clusterDomain: cluster.local
        storageClass: ""
        ingressClass: nginx-prod
        ingressDomain: example.com
