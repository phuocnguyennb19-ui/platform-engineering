ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: frontend-html.staging.example.com
      paths:
        - { path: /, pathType: Prefix }
  tls:
    - secretName: frontend-html-tls
      hosts: [ "frontend-html.staging.example.com" ]

