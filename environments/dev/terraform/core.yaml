vpc:
  cidr: 10.10.0.0/16
  az_count: 2
  single_nat_gateway: true
  enable_flow_logs: false

ecs:
  enabled: true
  fargate_base: 0
  fargate_weight: 0
  fargate_spot_weight: 100
  container_insights: true
  enable_execute_command: true

eks:
  enabled: true
  version: "1.32"
  endpoint_public_access: false
  node_groups:
    default:
      instance_types: ["t3.large"]
      capacity_type: SPOT
      min_size: 1
      max_size: 3
      desired_size: 1
  addon_roles:
    external-dns:
      service_accounts: ["infra:external-dns"]
    cluster-autoscaler:
      service_accounts: ["kube-system:cluster-autoscaler-aws-cluster-autoscaler"]
    velero:
      service_accounts: ["velero:velero-server"]

alb:
  enabled: false

iam:
  enabled: false

ecr:
  image_tag_mutability: IMMUTABLE
  force_delete: true
  mirror_repositories:
    - bitnami/clickhouse
    - bitnami/clickhouse-keeper
    - bitnami/jmx-exporter
    - bitnami/kafka
    - bitnami/postgres-exporter
    - bitnami/postgresql
    - bitnami/redis
    - bitnami/redis-exporter
    - bitnami/redis-sentinel
    - nginxinc/nginx-unprivileged

logs:
  retention_days: 7

alerts:
  subscriptions: {}
