# ============================================================
# Redis — custom config (mounted as ConfigMap via `commonConfiguration`)
# readFile'd in values.yaml.gotmpl → chart renders a ConfigMap and mounts it
# on master + replicas. Env-agnostic; sizing/HA stay in values ($size).
# ============================================================

# ── Memory / eviction (cache semantics) ─────────────────────
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ── Durability ──────────────────────────────────────────────
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
save 900 1
save 300 10
save 60 10000

# ── Client safety ───────────────────────────────────────────
timeout 300
tcp-keepalive 300
maxclients 10000

# ── Latency / slowlog observability ─────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128
latency-monitor-threshold 100

# ── Hardening: disable/rename dangerous commands ────────────
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
