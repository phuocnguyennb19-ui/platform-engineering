Quy tắc chung
- Lệnh nào cũng ghi rõ cluster (--context / --kube-context). Không dùng kubectl config use-context.
- Luôn chạy diff trước sync. diff không đổi gì trên cluster, sync thì có.
- Không dùng helmfile deps, dùng repos.
- Các override --set dưới đây chỉ dùng cho máy local và không lưu vào git, nên lần sync sau phải truyền lại.

---

Bước 0 — Chuẩn bị máy

Mục đích: có đủ công cụ, cluster đang chạy, và giải mã được secret của platform.

# 0.1 Công cụ (bản CI dùng: helm 3.20.1, helmfile 1.4.2, helm-diff 3.15.10, helm-secrets 4.7.7, sops 3.13.3)
helm version --short
helmfile --version
helm plugin list                 # phải có: diff, secrets
sops --version
kubectl version --client

Nếu thiếu plugin:
helm plugin install https://github.com/databus23/helm-diff --version v3.15.10
helm plugin install https://github.com/jkroepke/helm-secrets --version v4.7.7

0.2 Bật Kubernetes: Docker Desktop → Settings → Kubernetes → Enable Kubernetes → Apply & restart. Chờ biểu tượng Kubernetes chuyển xanh, khoảng 1–3 phút.

# 0.3 Age key. Trên macOS sops KHÔNG tự tìm ~/.config/sops/age/keys.txt, phải export
export SOPS_AGE_KEY_FILE=~/.config/sops/age/keys.txt
sops filestatus environments/dev/kubernetes/secrets.enc.yaml

# 0.4 Biến dùng cho cả hướng dẫn
C=docker-desktop

# 0.5 Tải index chart repo
helmfile -e dev -f kubernetes/helmfile.yaml.gotmpl repos

✅ Kết quả đúng
- helm plugin list có diff và secrets.
- sops filestatus in {"encrypted":true}.
- repos chạy xong không lỗi.

⚠️ Nếu lỗi
- Về sau gặp Failed to get the data key required to decrypt the SOPS file: chưa export SOPS_AGE_KEY_FILE trong terminal đang dùng.
- Mở terminal mới thì phải chạy lại 0.3 và 0.4.

---

Bước 1 — Kiểm tra cluster (chỉ đọc)

Mục đích: chắc chắn context trỏ đúng cluster local và biết trên cluster đang có gì trước khi thay đổi.

kubectl config view --minify --context=$C -o jsonpath='{.clusters[0].cluster.server}{"\n"}'
kubectl --context=$C get nodes -o wide
helm --kube-context $C list -A
kubectl --context=$C get ns
bash scripts/cluster/preflight.sh --cluster docker-desktop-dev --context $C

✅ Kết quả đúng
- Server là https://127.0.0.1:<port>. Port đổi mỗi lần bật lại Kubernetes.
- 3 node Ready: desktop-control-plane, desktop-worker, desktop-worker2.
- Trên cluster mới: helm list -A trống; namespace chỉ có default, kube-*, local-path-storage.
- Preflight có FAIL 0. Các WARN sau là bình thường trên cluster mới, các bước sau sẽ xử lý:
  - chưa có namespace dev;
  - chưa có ingress controller;
  - chưa có CRD Prometheus Operator.

⚠️ Nếu lỗi
- connection refused: Kubernetes đang tắt (lúc đó docker ps cũng trống). Quay lại 0.2.
- Server không phải 127.0.0.1: dừng lại, context đang trỏ sang cluster khác.

---

Bước 2 — Chọn Docker Desktop làm target của dev

Mục đích: platform tool nhận cluster qua --kube-context, còn app thì lấy cluster từ file target, để không deploy nhầm cluster vì context ngầm.

Thứ tự ưu tiên: biến KUBE_CONTEXT_DEV > target.local.yaml (gitignored) > target.yaml.

Sửa environments/dev/kubernetes/cluster/target.local.yaml thành:
schema: kubernetes-target/v1alpha1
cluster: docker-desktop-dev

Kiểm tra:
cat environments/dev/kubernetes/cluster/target.local.yaml
grep -E '^(context|  owner):' environments/dev/kubernetes/cluster/docker-desktop-dev.yaml
env | grep -E '^KUBE_CONTEXT' || echo "không có KUBE_CONTEXT* — tốt"

✅ Kết quả đúng
- context: docker-desktop, owner: helmfile.
- Không có biến KUBE_CONTEXT nào được đặt.

⚠️ Nếu lỗi
- Có KUBE_CONTEXT=...: chạy unset KUBE_CONTEXT, nếu không release guard sẽ chặn ở bước 8.
- Hiện file này trên máy bạn đang trỏ cluster Lima (self-managed-dev). Muốn quay lại Lima thì đặt cluster: self-managed-dev và context: self-managed-dev.

---

Bước 3 — Infra Base: namespace + PSA

Mục đích: tạo namespace platform và namespace dev kèm nhãn Pod Security. Phải làm trước helm, vì --create-namespace của helm không gắn nhãn PSA.

┌─────────────────────────────┬────────────┬─────────────────────────────────────────────┐
│          Namespace          │    PSA     │                  Dùng cho                   │
├─────────────────────────────┼────────────┼─────────────────────────────────────────────┤
│ infra                       │ baseline   │ cert-manager, kong                          │
├─────────────────────────────┼────────────┼─────────────────────────────────────────────┤
│ observability               │ privileged │ monitoring                                  │
├─────────────────────────────┼────────────┼─────────────────────────────────────────────┤
│ database                    │ restricted │ minio, postgresql, redis, kafka, clickhouse │
├─────────────────────────────┼────────────┼─────────────────────────────────────────────┤
│ dev                         │ restricted │ app                                         │
├─────────────────────────────┼────────────┼─────────────────────────────────────────────┤
│ velero, trivy-system, falco │ privileged │                                             │
├─────────────────────────────┼────────────┼─────────────────────────────────────────────┤
│ vault, argocd               │ baseline   │                                             │
├─────────────────────────────┼────────────┼─────────────────────────────────────────────┤
│ harbor, keda                │ restricted │                                             │
└─────────────────────────────┴────────────┴─────────────────────────────────────────────┘

kubectl --context=$C diff  -f environments/dev/kubernetes/namespace/namespaces.yaml
kubectl --context=$C apply -f environments/dev/kubernetes/namespace/namespaces.yaml
kubectl --context=$C get ns -L pod-security.kubernetes.io/enforce

✅ Kết quả đúng
- 11 dòng namespace/... created, hoặc unchanged nếu đã có.
- Cột ENFORCE khớp bảng trên.

⚠️ diff trả exit code 1 khi có khác biệt, đó không phải lỗi. Lỗi thật sẽ in error:.

---

Bước 4 — CRD monitoring

Mục đích: cài 10 CRD monitoring.coreos.com (ServiceMonitor, PrometheusRule, …).
- cert-manager và khoảng 18 tool khác cần CRD này.
- Release không cần age key.
- CRD được giữ lại khi gỡ release, vì xoá CRD là xoá mọi ServiceMonitor trong cluster.

T=kubernetes/releases/observability/prometheus-operator-crds/helmfile.yaml.gotmpl
helmfile -e dev --kube-context $C -f $T diff        # in rất dài (schema của 10 CRD) — bình thường
helmfile -e dev --kube-context $C -f $T sync
helm --kube-context $C -n kube-system list
kubectl --context=$C get crd | grep monitoring.coreos.com

✅ Kết quả đúng
- prometheus-operator-crds ở trạng thái deployed, chart 30.0.1, app v0.92.1.
- Có 10 CRD *.monitoring.coreos.com.

⚠️ invalid ownership metadata: cluster đã có CRD từ một lần cài kube-prometheus-stack cũ. Xem mục "Existing cluster…" trong kubernetes/releases/observability/prometheus-operator-crds/README.md.

---

Bước 5 — cert-manager + CA local

Mục đích: cấp chứng chỉ TLS cho Ingress. Release gồm:
- CRD của cert-manager;
- 3 deployment (controller, webhook, cainjector);
- 2 ClusterIssuer letsencrypt-* ở dạng hook, nên một lần sync là đủ.

Let's Encrypt không dùng được trên máy local, vì email example.com bị từ chối và domain không trỏ về máy bạn. Vì vậy cần tạo thêm một CA tự ký (5b).

5a. cert-manager

T=kubernetes/releases/platform/cert-manager/helmfile.yaml.gotmpl
helmfile -e dev --kube-context $C -f $T diff --diff-args '--disable-validation'   # lần đầu: chưa có CRD
helmfile -e dev --kube-context $C -f $T sync                                       # ~35 s
kubectl --context=$C -n infra get pods
kubectl --context=$C get crd | grep cert-manager.io
kubectl --context=$C get clusterissuer

✅ Kết quả đúng
- In ra cert-manager v1.21.0 has been deployed successfully!.
- 3 pod 1/1 Running.
- 6 CRD *.cert-manager.io.
- letsencrypt-* có READY False với lỗi invalidContact … "example.com". Đây là dự kiến.

5b. CA local (chỉ cho cluster này, không nằm trong repo)

kubectl --context=$C apply -f - <<'EOF'
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: local-selfsigned }
spec: { selfSigned: {} }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: local-ca, namespace: infra }
spec:
  isCA: true
  commonName: docker-desktop local CA
  secretName: local-ca
  duration: 87600h
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: local-selfsigned, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: local-ca }
spec:
  ca: { secretName: local-ca }
EOF
kubectl --context=$C -n infra get certificate local-ca
kubectl --context=$C wait --for=condition=Ready clusterissuer/local-ca --timeout=60s

✅ Kết quả đúng
- Certificate local-ca có READY True.
- In ra condition met.

⚠️ Nếu lỗi
- no matches for kind "ServiceMonitor": chưa làm bước 4.
- diff lỗi no matches for kind "ClusterIssuer": thiếu --disable-validation.
- 5b lỗi failed calling webhook: webhook chưa sẵn sàng, chờ 30 giây rồi chạy lại.

---

Bước 6 — metrics-server (cho HPA / kubectl top, có thể bỏ qua)

Mục đích: cung cấp API metrics.
- Chứng chỉ kubelet của kind không có IP SAN, nên phải thêm --kubelet-insecure-tls trên dòng lệnh, không sửa value trong git (EKS dev dùng chung value đó).
- Cờ này chỉ chấp nhận được trên máy local.

T=kubernetes/releases/platform/metrics-server/helmfile.yaml.gotmpl
LOCAL='args={--kubelet-preferred-address-types=InternalIP\,Hostname\,ExternalIP,--kubelet-insecure-tls}'
helmfile -e dev --kube-context $C -f $T diff --set "$LOCAL"
helmfile -e dev --kube-context $C -f $T sync --set "$LOCAL"
kubectl --context=$C -n kube-system rollout status deploy/metrics-server --timeout=120s
kubectl --context=$C get apiservice v1beta1.metrics.k8s.io
kubectl --context=$C top nodes

✅ Kết quả đúng
- APIService ở trạng thái AVAILABLE True.
- top nodes in số liệu của 3 node; có thể phải chờ khoảng 1 phút.

⚠️ Nếu lỗi
- Log báo x509 … IP SANs: quên --set "$LOCAL".
- Metrics API not available: chờ 60 giây.

---

Bước 7 — kong (ingress controller)

Mục đích: cho Ingress của app có đường vào (IngressClass kong, namespace infra). Không có kong thì app vẫn chạy, chỉ truy cập được bằng port-forward.

docker pull kong:3.9      # kiểm mạng trước — lần 22/10 hỏng ở đây
T=kubernetes/releases/platform/kong/helmfile.yaml.gotmpl
helmfile -e dev --kube-context $C -f $T diff --diff-args '--disable-validation'
helmfile -e dev --kube-context $C -f $T sync
kubectl --context=$C -n infra get pods -l app.kubernetes.io/instance=kong
kubectl --context=$C get ingressclass
kubectl --context=$C -n infra get svc kong-proxy

✅ Kết quả đúng
- Pod kong Running.
- Có IngressClass kong.
- kong-proxy có EXTERNAL-IP. Docker Desktop cấp địa chỉ LoadBalancer qua kind-cloud-provider, nhưng điểm này chưa kiểm chứng trong repo.

⚠️ Nếu lỗi
- docker pull timeout hoặc ImagePullBackOff: kiểm tra VPN, hoặc proxy trong Docker Desktop → Settings → Resources → Proxies.
- kong-proxy đứng <pending> và sync treo tới 900 giây: chạy lại sync --set proxy.type=ClusterIP (chỉ cho local).
- Lần diff nào cũng có thay đổi ở webhook: bình thường, chart sinh lại CA mỗi lần render.

---

Bước 8 — Deploy app

Mục đích: cài app với value gộp từ 3 lớp:
1. value mặc định của chart;
2. environments/dev/kubernetes/app-values.yaml.gotmpl;
3. applications/<app>/k8s/dev/values.yaml.

Release guard chặn sync khi:
- thiếu -l name=<app>;
- owner của cluster không phải helmfile, hoặc Argo CD đã quản lý app;
- context sai hoặc thiếu, hoặc có biến KUBE_CONTEXT;
- value còn REPLACE_WITH_. Ví dụ frontend-html bị chặn, và chặn như vậy là đúng.

# Chỉ dùng khi đã làm 5b; không có 5b thì bỏ --set "$O"
O='ingress.annotations.cert-manager\.io/cluster-issuer=local-ca'

helmfile -e dev -l name=devops-platform diff --set "$O"
helmfile -e dev -l name=devops-platform sync --set "$O"
helmfile -e dev -l name=test-app diff --set "$O"
helmfile -e dev -l name=test-app sync --set "$O"

kubectl --context=$C -n dev rollout status deploy/devops-platform-application --timeout=120s
kubectl --context=$C -n dev rollout status deploy/test-app-application --timeout=120s
kubectl --context=$C -n dev get pods,svc,ingress
kubectl --context=$C -n dev get certificate
helm --kube-context $C -n dev test devops-platform

✅ Kết quả đúng
- Dòng đầu của sync là [OK] <app> @ dev → cluster 'docker-desktop-dev' context 'docker-desktop'. Nếu thấy cluster khác thì Ctrl-C ngay.
- Pod Running, không restart.
- Nếu có kong và đã làm 5b: Certificate có READY True và Ingress có ADDRESS.
- helm test báo Phase: Succeeded.

⚠️ Nếu lỗi

┌───────────────────────────┬──────────────────────────────────────────┐
│        [BLOCKED] …        │                  Xử lý                   │
├───────────────────────────┼──────────────────────────────────────────┤
│ no selector               │ thêm -l name=<app>                       │
├───────────────────────────┼──────────────────────────────────────────┤
│ not in kubeconfig         │ sai bước 2, hoặc Kubernetes đang tắt     │
├───────────────────────────┼──────────────────────────────────────────┤
│ KUBE_CONTEXT=… is set     │ unset KUBE_CONTEXT                       │
├───────────────────────────┼──────────────────────────────────────────┤
│ REPLACE_WITH_ placeholder │ app chưa có registry thật, chọn app khác │
├───────────────────────────┼──────────────────────────────────────────┤
│ Certificate READY False   │ thiếu bước 5b, hoặc quên --set "$O"      │
└───────────────────────────┴──────────────────────────────────────────┘

