# ============================================================
# Kafka — extra broker config (mounted via `extraConfig` ConfigMap)
# readFile'd in values.yaml.gotmpl. Static, env-agnostic broker tunables live
# here; durability knobs that scale per-env (replication factors, ISR,
# retention) are appended from the $size table in values.yaml.gotmpl.
# ============================================================

# ── Topic governance ────────────────────────────────────────
auto.create.topics.enable=false
delete.topic.enable=true
num.partitions=3

# ── Threads / networking ────────────────────────────────────
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# ── Log / storage ───────────────────────────────────────────
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000
compression.type=producer
log.cleanup.policy=delete

# ── Group / rebalance stability ─────────────────────────────
group.initial.rebalance.delay.ms=3000
offsets.retention.minutes=10080

# ── Producer safety ─────────────────────────────────────────
# min.insync.replicas + replication factors are appended per-env (see values).
unclean.leader.election.enable=false
