# frontend-html · dev — toàn bộ value của app ở môi trường này (chart kubernetes/charts/application).
# Thêm cấu hình: thêm key vào file này. Mọi key: docs/reference/application-chart.md

image:
  repository: frontend-html
  tag: "1.30.5-alpine-slim"
  digest: sha256:7f79f463c6eb0d0bf8782992bb9636434398e3e5848398805aef2c9b025d8609
  pullPolicy: IfNotPresent

probes:
  startup: {httpGet: {path: /healthz, port: http}, failureThreshold: 15, periodSeconds: 2}
  liveness: {httpGet: {path: /healthz, port: http}, periodSeconds: 15, timeoutSeconds: 3}
  readiness: {httpGet: {path: /healthz, port: http}, periodSeconds: 10, timeoutSeconds: 3}

resources:
  requests: {cpu: 10m, memory: 32Mi}
  limits: {memory: 64Mi}

extraVolumes:
  - name: tmp
    emptyDir: {medium: Memory, sizeLimit: 16Mi}   # tmpfs counts against limits.memory (64Mi) — keep it small
  - name: html
    configMap:
      name: frontend-html-application-site
      items: [{key: index.html, path: index.html}]
  - name: nginx-conf
    configMap:
      name: frontend-html-application-site
      items: [{key: default.conf, path: default.conf}]

extraVolumeMounts:
  - {name: tmp, mountPath: /tmp}
  - {name: html, mountPath: /usr/share/nginx/html, readOnly: true}
  - {name: nginx-conf, mountPath: /etc/nginx/conf.d, readOnly: true}

initContainers: []

workers: []

extraConfigMaps:
  site:
    index.html: |
      <!doctype html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>frontend-html</title>
        <style>
          body { font-family: system-ui, sans-serif; margin: 3rem auto; max-width: 40rem; padding: 0 1rem; }
          code { background: #f2f2f2; padding: .1rem .3rem; }
        </style>
      </head>
      <body>
        <h1>frontend-html</h1>
        <p>Static frontend served by <code>nginx-unprivileged</code> from a ConfigMap.</p>
        <p>If you can read this through the Ingress, image pull, Pod Security,
           Service, Ingress and NetworkPolicy all work for this environment.</p>
      </body>
      </html>
    default.conf: |
      server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        server_tokens off;

        # probes — no access log noise
        location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

        location / {
          try_files $uri $uri/ /index.html;   # single-page-app fallback
        }

        # never cache the HTML entry point; static assets can be cached hard
        location = /index.html { add_header Cache-Control "no-cache"; }
        location ~* \.(css|js|png|jpg|svg|ico|woff2?)$ { expires 7d; add_header Cache-Control "public"; }
      }

reloader:
  enabled: true

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-staging
  hosts:
    - host: frontend-html.dev.example.com
      paths:
        - {path: /, pathType: Prefix}
  tls:
    - secretName: frontend-html-tls
      hosts: ["frontend-html.dev.example.com"]
