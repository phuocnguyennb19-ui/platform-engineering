# ============================================================
# ARGO CD workflow — GitOps app-tier (kubernetes/argocd/**, applications/*/k8s/**)
#
# Include from the root .gitlab-ci.yml:
#   include: { local: ci/k8s/argocd.yml }
#
# PULL model: git is the source of truth, Argo CD syncs itself. CI does NOT push
# per-app deploys — CI only (1) validates manifests/values, (2) ensures the
# App-of-Apps root exists, (3) optionally `argocd app diff` for PR review.
#
# Trigger: changes under kubernetes/argocd/** or applications/*/k8s/**.
#
# CI/CD vars (group-level):
#   DEPLOY_TOOLS_IMAGE       image with kubectl + helm (+ argocd cli for diff)
#   ARGOCD_SERVER            e.g. argocd.example.com  (for the diff job, optional)
#   ARGOCD_AUTH_TOKEN        argocd account token (for the diff job, optional)
#   DEV_EKS_CLUSTER / PROD_EKS_CLUSTER ...   (for the bootstrap job)
# ============================================================

.argocd-changes: &argocd-changes
  changes:
    - kubernetes/argocd/**/*
    - scripts/deploy/check-argocd-bootstrap.sh
    - applications/*/k8s/**/*
    - applications/helmfile.yaml.gotmpl
    - environments/*/kubernetes/app-values.yaml.gotmpl
    - kubernetes/charts/application/**/*


# stages declared in the root .gitlab-ci.yml: argo-validate · argo-diff · argo-bootstrap

# ── VALIDATE — offline, no cluster needed ───────────────────
# 1) client-side YAML + schema check for the Argo manifests.
# 2) render every app × env through applications/helmfile.yaml.gotmpl → ensures it renders.
argocd:validate:
  image: $DEPLOY_TOOLS_IMAGE
  stage: argo-validate
  script:
    - cd "$CI_PROJECT_DIR/kubernetes"
    # The manifests must point at THIS project: a wrong repoURL makes Argo deploy
    # from somewhere CI never validated.
    - |
      want="${CI_PROJECT_URL}.git"
      bad=$(grep -rhoE 'repoURL: *[^ ]+|^ *- https://[^ ]+\.git' argocd/root-app.yaml argocd/bootstrap | grep -oE 'https://[^ ]+' | sort -u | grep -vxF "$want" || true)
      [ -z "$bad" ] || { echo "[ERROR] Argo CD repoURL must be ${want}; found: ${bad}"; exit 1; }
    # The root app syncs bootstrap/ with prune + selfHeal and may write AppProjects and
    # ApplicationSets: refuse anything that would widen Argo CD (a permissive AppProject, an
    # ApplicationSet outside project platform, another kind, another source).
    - |
      set -euo pipefail
      case "$(uname -m)" in
        x86_64) YQ_ARCH=amd64; YQ_SHA256=0fb28c6680193c41b364193d0c0fc4a03177aecde51cfc04d506b1517158c2fb ;;
        aarch64|arm64) YQ_ARCH=arm64; YQ_SHA256=b7f7c991abe262b0c6f96bbcb362f8b35429cefd59c8b4c2daa4811f1e9df599 ;;
        *) echo "[ERROR] no pinned yq build for $(uname -m)"; exit 1 ;;
      esac
      curl -fsSL -o /tmp/yq "https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_${YQ_ARCH}"
      echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c -
      chmod +x /tmp/yq
      PATH="/tmp:$PATH" bash "$CI_PROJECT_DIR/scripts/deploy/check-argocd-bootstrap.sh" "${CI_PROJECT_URL}.git"
    - |
      echo "=== 1. Argo manifests (client dry-run) ==="
      kubectl apply --dry-run=client -f argocd/root-app.yaml
      kubectl apply --dry-run=client -R -f argocd/bootstrap/

      echo "=== 2. Render every app × env through applications/helmfile.yaml.gotmpl ==="
      # The value layers are defined only there (the ApplicationSet repeats them;
      # `make argocd-render` checks the two agree).
      for env in dev staging prod; do
        echo "--- apps @ $env ---"
        helmfile -e "$env" -f ../applications/helmfile.yaml.gotmpl template --skip-deps --allow-no-matching-release > /dev/null
      done
      echo "[OK] app-tier manifests + values are valid"
  rules:
    - !reference [.k8s-guard, rules]
    - !reference [.k8s-push-mr-only, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      <<: *argocd-changes
    - if: $CI_COMMIT_BRANCH
      <<: *argocd-changes

# ── DIFF (optional) — what Argo would change on merge (PR review) ──
# Requires ARGOCD_SERVER + ARGOCD_AUTH_TOKEN. Skipped if not configured.
argocd:diff:
  image: $DEPLOY_TOOLS_IMAGE
  stage: argo-diff
  script:
    - cd "$CI_PROJECT_DIR/kubernetes"
    - |
      if [ -z "$ARGOCD_SERVER" ] || [ -z "$ARGOCD_AUTH_TOKEN" ]; then
        echo "[SKIP] ARGOCD_SERVER/ARGOCD_AUTH_TOKEN not configured"; exit 0
      fi
      export ARGOCD_SERVER ARGOCD_AUTH_TOKEN
      for app in $(ls -d ../applications/*/k8s/ | xargs -n1 dirname | xargs -n1 basename); do
        echo "=== argocd app diff $app ==="
        argocd app diff "$app" --revision "$CI_COMMIT_SHA" || true
      done
  allow_failure: true
  rules:
    - !reference [.k8s-guard, rules]
    - !reference [.k8s-push-mr-only, rules]
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      <<: *argocd-changes

# ── BOOTSTRAP — ensure the App-of-Apps root exists (idempotent) ─
# Runs on main. After this Argo pulls & syncs every app from git on its own.
# Each environment's cluster runs its own Argo CD and deploys only itself.
.argocd-bootstrap:
  image: $DEPLOY_TOOLS_IMAGE
  stage: argo-bootstrap
  before_script:
    - cd "$CI_PROJECT_DIR/kubernetes"
    - !reference [.ci-env-select, script]
    - !reference [.ci-aws-auth, script]
    - !reference [.ci-eks-kubeconfig, script]
  script:
    - cd "$CI_PROJECT_DIR/kubernetes"
    # The manifests must point at THIS project: a wrong repoURL makes Argo deploy
    # from somewhere CI never validated.
    - |
      want="${CI_PROJECT_URL}.git"
      bad=$(grep -rhoE 'repoURL: *[^ ]+|^ *- https://[^ ]+\.git' argocd/root-app.yaml argocd/bootstrap | grep -oE 'https://[^ ]+' | sort -u | grep -vxF "$want" || true)
      [ -z "$bad" ] || { echo "[ERROR] Argo CD repoURL must be ${want}; found: ${bad}"; exit 1; }
    - !reference [.ci-config-complete, script]
    - echo "[INFO] apply App-of-Apps root (idempotent) → ${DEPLOY_ENV}"
    - kubectl apply -f argocd/root-app.yaml
    - kubectl -n infra get applications.argoproj.io
  resource_group: argocd-$DEPLOY_ENV

argocd:bootstrap:dev:
  extends: .argocd-bootstrap
  variables: { DEPLOY_ENV: dev }
  environment: { name: dev/argocd }
  rules:
    - !reference [.k8s-guard, rules]
    - !reference [.k8s-push-mr-only, rules]
    - if: $CI_COMMIT_BRANCH =~ /^(dev|develop)$/
      when: manual
      <<: *argocd-changes

argocd:bootstrap:staging:
  extends: .argocd-bootstrap
  variables: { DEPLOY_ENV: staging }
  environment: { name: staging/argocd }
  rules:
    - !reference [.k8s-guard, rules]
    - !reference [.k8s-push-mr-only, rules]
    - if: $CI_COMMIT_BRANCH == "staging"
      when: manual
      <<: *argocd-changes

argocd:bootstrap:prod:
  extends: .argocd-bootstrap
  variables: { DEPLOY_ENV: prod }
  environment: { name: prod/argocd }
  rules:
    - !reference [.k8s-guard, rules]
    - !reference [.k8s-push-mr-only, rules]
    - if: $CI_COMMIT_BRANCH =~ /^(main|master)$/
      when: manual                       # controlled root apply
      <<: *argocd-changes
