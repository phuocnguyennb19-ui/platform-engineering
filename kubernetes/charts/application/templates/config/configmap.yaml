{{- /* Chart-owned ConfigMap. Content changes trigger a rollout via
       checksum/configmap on the pod template. */ -}}
{{- if .Values.configmap.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "application.configmapName" . }}
  namespace: {{ include "application.namespace" . }}
  labels:
    {{- include "application.labels" (dict "root" $ "component" "app") | nindent 4 }}
  {{- with .Values.configmap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.configmap.data }}
data:
  {{- range $k, $v := . }}
  {{ $k }}: {{ tpl (toString $v) $ | quote }}
  {{- end }}
{{- end }}
{{- with .Values.configmap.binaryData }}
binaryData:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}

{{- /* Extra ConfigMaps — mounted config files, nginx.conf, otel config ...
       Every document starts with `---`: without it `configmap` and each entry here
       rendered into ONE YAML document and all but the last ConfigMap were lost. */ -}}
{{- range $name, $cm := .Values.extraConfigMaps }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s" (include "application.fullname" $) $name | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "application.namespace" $ }}
  labels:
    {{- include "application.labels" (dict "root" $ "component" "app") | nindent 4 }}
data:
  {{- range $k, $v := $cm }}
  {{ $k }}: |
    {{- tpl (toString $v) $ | nindent 4 }}
  {{- end }}
{{- end }}
