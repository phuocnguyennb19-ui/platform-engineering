{{- /* Chart-owned Secret.

       ⚠ This puts secret material in the Helm release and in git (SOPS-encrypted
       at rest, plaintext once decrypted into values). It exists for low-value
       config only. Real credentials belong in `externalSecret` (ESO → Vault /
       Secrets Manager) or an out-of-band Secret referenced via extraEnvFrom. */ -}}
{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "application.secretName" . }}
  namespace: {{ include "application.namespace" . }}
  labels:
    {{- include "application.labels" (dict "root" $ "component" "app") | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: {{ .Values.secret.type | default "Opaque" }}
{{- with .Values.secret.data }}
data:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.secret.stringData }}
stringData:
  {{- range $k, $v := . }}
  {{ $k }}: {{ tpl (toString $v) $ | quote }}
  {{- end }}
{{- end }}
{{- end }}
