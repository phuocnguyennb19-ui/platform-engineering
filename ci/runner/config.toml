# GitLab Runner configuration
# Path trên host: /etc/gitlab-runner/config.toml
#
# Không hardcode token ở đây — inject qua env var khi register.
# Register command:
#
#   docker run --rm -it \
#     -v /etc/gitlab-runner:/etc/gitlab-runner \
#     myorg/gitlab-runner:17.2.1 \
#     gitlab-runner register \
#       --non-interactive \
#       --url "https://gitlab.com" \
#       --token "$GITLAB_RUNNER_TOKEN" \
#       --executor "docker" \
#       --docker-image "alpine:3.20" \
#       --docker-volumes "/var/run/docker.sock:/var/run/docker.sock" \
#       --docker-privileged "false" \
#       --description "microservice-runner-prod" \
#       --tag-list "docker,aws,microservice" \
#       --run-untagged "false" \
#       --locked "false"

concurrent = 8
check_interval = 3
shutdown_timeout = 60

[session_server]
  session_timeout = 1800

[[runners]]
  name = "microservice-runner"
  url = "https://gitlab.com"
  # token được inject sau khi register — jangan hardcode
  executor = "docker"
  # Thời gian tối đa 1 job được phép chạy (30 phút)
  output_limit = 32768

  [runners.custom_build_dir]

  [runners.cache]
    MaxUploadedArchiveSize = 0
    [runners.cache.s3]
      # S3 cache — giúp cache Go modules, Docker layers giữa các job
      # ServerAddress = "s3.amazonaws.com"
      # BucketName = "my-gitlab-runner-cache"
      # BucketLocation = "ap-southeast-1"
      # Insecure = false

  [runners.docker]
    # Default image khi job không specify image:
    image = "alpine:3.20"

    # Mount Docker socket — runner tạo sibling containers,
    # KHÔNG dùng Docker-in-Docker (tránh privileged mode)
    volumes = [
      "/var/run/docker.sock:/var/run/docker.sock",
      "/cache",
    ]

    # Không chạy privileged — bắt buộc với socket mount
    privileged = false

    # Pull policy: always đảm bảo image luôn up-to-date
    # Đổi thành "if-not-present" để tiết kiệm bandwidth khi dev
    pull_policy = ["always", "if-not-present"]

    # Network mode: host cho phép runner container reach được
    # private registry / EKS API endpoint
    network_mode = "bridge"

    # Cleanup container sau mỗi job
    disable_cache = false

    # SHM size cho Docker builds (quan trọng với Go compilation)
    shm_size = 0

    # Giới hạn tài nguyên của mỗi job container
    memory = "2g"
    cpus = "2"

    # Disable IPv6 nếu infrastructure không support
    # disable_entrypoint_overwrite = false
